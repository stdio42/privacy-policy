<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stdio42</title>
    <style>
        :root {
            --bg: #0d1117;
            --fg: #c9d1d9;
            --accent: #58a6ff;
            --muted: #8b949e;
            --border: #30363d;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            color: #fff;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }
        a {
            color: var(--accent);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .philosophy {
            font-size: 1.2em;
            color: var(--muted);
            margin-bottom: 32px;
        }
        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 32px 0;
        }
        .muted {
            color: var(--muted);
        }
        .nav-list {
            list-style: none;
            padding: 0;
        }
        .nav-list li {
            margin: 16px 0;
        }
        .nav-list a {
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>stdio42</h1>
        <p class="philosophy">
            Software that doesn't suck.
        </p>
        <p>
            We build apps that respect you. No tracking. No ads. No data collection. No nonsense.
        </p>

        <hr>

        <ul class="nav-list">
            <li><a href="privacy.html">Privacy Policy</a></li>
            <li><a href="support.html">Support</a></li>
        </ul>

        <hr>

        <p class="muted" style="text-align: center;">
            &copy; stdio42
        </p>
    </div>
</body>
</html>
