<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - stdio42</title>
    <style>
        :root {
            --bg: #0d1117;
            --fg: #c9d1d9;
            --accent: #58a6ff;
            --muted: #8b949e;
            --border: #30363d;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            color: #fff;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }
        a {
            color: var(--accent);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .philosophy {
            font-size: 1.2em;
            color: var(--muted);
            margin-bottom: 32px;
        }
        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 32px 0;
        }
        .muted {
            color: var(--muted);
        }
        .form-container {
            background: #161b22;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }
        .form-container iframe {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Support</h1>
        <p class="philosophy">
            Need help? Have a question? Let us know.
        </p>

        <div class="form-container">
            <iframe src="https://seemly-ninja-1cc.notion.site/ebd/2da4464fcba680418853ffaf7a5d3bed" width="100%" height="792" frameborder="0" allowfullscreen></iframe>
        </div>

        <hr>

        <p class="muted">
            <a href="privacy.html">&larr; Privacy Policy</a>
        </p>

        <hr>
        <p class="muted" style="text-align: center;">
            &copy; stdio42 — Software that doesn't suck
        </p>
    </div>
</body>
</html>
