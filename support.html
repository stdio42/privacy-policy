<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - stdio42</title>
    <style>
        :root {
            --bg: #0d1117;
            --fg: #c9d1d9;
            --accent: #58a6ff;
            --muted: #8b949e;
            --border: #30363d;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            color: #fff;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }
        a {
            color: var(--accent);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .philosophy {
            font-size: 1.2em;
            color: var(--muted);
            margin-bottom: 32px;
        }
        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 32px 0;
        }
        .muted {
            color: var(--muted);
        }
        .form-container {
            background: #161b22;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }
        .form-container iframe {
            display: block;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .footer-links {
            display: flex;
            gap: 24px;
        }
        .nav-bar {
            max-width: 720px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .nav-brand {
            color: #fff;
            font-weight: 600;
            font-size: 1.1em;
        }
        .nav-links {
            display: flex;
            gap: 24px;
        }
        .nav-links a {
            color: var(--muted);
        }
        .nav-links a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="/" class="nav-brand">stdio42</a>
        <div class="nav-links">
            <a href="privacy.html">Privacy</a>
            <a href="support.html">Support</a>
            <a href="https://github.com/stdio42">GitHub</a>
        </div>
    </nav>
    <div class="container">
        <h1>Support</h1>
        <p class="philosophy">
            Need help? Have a question? Let us know.
        </p>

        <div class="form-container">
            <iframe src="https://seemly-ninja-1cc.notion.site/ebd/2da4464fcba680418853ffaf7a5d3bed" width="100%" height="792" frameborder="0" allowfullscreen></iframe>
        </div>

        <hr>

        <div class="footer">
            <p class="muted">&copy; stdio42</p>
            <div class="footer-links">
                <a href="/">Home</a>
                <a href="privacy.html">Privacy</a>
            </div>
        </div>
    </div>
</body>
</html>
